<head>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#12356b;--teal:#0e9aa7;--orange:#f08a24;--bg:#f3f6fb;--card:#fff;--ink:#1d2b3a;--mut:#64738a;--ok:#1e9e5a;--bad:#d64545;--warn:#c98a00;--line:#dbe3ee}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.85;font-size:16px}
header{background:linear-gradient(135deg,var(--navy),#1d5aa8);color:#fff;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px;font-weight:800}
header small{opacity:.85;display:block;font-weight:500}
.chip{background:rgba(255,255,255,.15);border-radius:30px;padding:4px 14px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

#steps{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:4px;padding:8px 10px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.step{flex:1 0 auto;border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;font-family:inherit;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.step.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.step.done:not(.on){border-color:var(--ok);color:var(--ok)}
.pbar{height:5px;background:#e7edf5}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--orange));width:0;transition:.4s}
main{max-width:1050px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:16px;padding:18px 20px;margin:14px 0;box-shadow:0 2px 10px rgba(18,53,107,.07);border:1px solid var(--line)}
.card h3{margin:0 0 10px;color:var(--navy);font-size:18px}
.hero{background:linear-gradient(135deg,#e9f6f8,#fff4e6);border-radius:16px;padding:18px 22px;border:1px solid #cfe7ea}

.btn{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:8px 16px;font-family:inherit;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.12)}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.btn.sec{background:var(--orange)}
.btn.ok{background:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
.nav{justify-content:space-between;margin:18px 0}
.in,textarea,select.in{font-family:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;background:#fff;color:var(--ink)}
input.in[type=number]{width:130px}
textarea{width:100%;min-height:80px;resize:vertical}
.tag{background:var(--teal);color:#fff;border-radius:20px;padding:1px 10px;font-size:12px;margin-inline-end:6px}
.badge{display:inline-block;border-radius:20px;padding:2px 12px;font-size:13px;color:#fff;background:var(--orange)}
.mut{color:var(--mut)}
.hint{display:none;background:#fff8e1;border-right:4px solid var(--orange);padding:6px 12px;border-radius:8px;margin:6px 0;font-size:14px}
.hint.on{display:block}
.fb{margin-top:6px;font-size:14px;border-radius:8px;padding:0 10px}
.fb.ok,.qfb.ok{background:#e7f6ee;color:#116b3b;padding:6px 10px;border-radius:8px}
.fb.bad,.qfb.bad{background:#fdecec;color:#a02727;padding:6px 10px;border-radius:8px}
.fb.warn{background:#fff6dd;color:#7a5600;padding:6px 10px;border-radius:8px}
.qfb{margin-top:6px;font-size:14px}
.task,.q{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;background:#fcfdff}
.task.okc{border-color:var(--ok);background:#f4fbf7}
.opt{display:block;padding:3px 0;cursor:pointer}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tab{border:0;background:#eaf0f8;border-radius:10px 10px 0 0;padding:6px 14px;font-family:inherit;cursor:pointer}
.tab.on{background:var(--navy);color:#fff}
.vwrap{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.phet .vwrap{padding-top:62%}
.sim canvas,canvas.fluid{width:100%;height:auto;border-radius:12px;border:1.5px solid var(--line);background:#bfe3f2;touch-action:none;display:block}
.sim-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media(max-width:760px){.sim-grid{grid-template-columns:1fr}}
.sim-ctl label{display:block;margin:6px 0;font-size:14px}
.sim-ctl input[type=range]{width:100%}
.sim-out{background:#f1f6fc;border-radius:12px;padding:8px 14px;font-size:14px;line-height:1.9}
.sim-out b{color:var(--navy)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}
th{background:#eaf1fa}
td.l{text-align:right}
details{border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;margin:8px 0;background:#fcfdff}
summary{cursor:pointer;font-weight:700;color:var(--navy)}
.eq{background:#eef5ff;border-radius:10px;padding:6px 14px;text-align:center;font-size:17px;margin:8px 0;direction:ltr;font-family:'Tajawal',serif}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}}
.bar{height:22px;border-radius:6px;background:var(--teal);color:#fff;font-size:13px;padding:0 8px;white-space:nowrap;min-width:30px}
.overlay{position:fixed;inset:0;background:rgba(10,25,50,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
.overlay.hidden{display:none}
.box{background:#fff;border-radius:18px;padding:24px;max-width:560px;width:100%}
.box.wide{max-width:980px;max-height:92vh;overflow:auto}
.box h2{margin-top:0;color:var(--navy)}
.box select,.box input[type=text]{width:100%;margin:6px 0;font-family:inherit;font-size:16px;padding:8px;border:1.5px solid var(--line);border-radius:10px}
.gcard{border:1.5px solid var(--teal);border-radius:12px;padding:8px 12px;background:#f2fbfc}
.gcard b{color:var(--navy)}
footer{text-align:center;color:var(--mut);font-size:13px;padding:20px}
@media print{header,#steps,.pbar,.nav,.btn{display:none!important}.card{box-shadow:none}}
</style>
</head>

 <div><h1>✈️ رسم مسار الرحلة – منصة استقصاء بنموذج 5E<small>الوحدة الثانية • النشاط الرابع • الصف الأول الثانوي (موهبة) • مدارس الأنجال الأهلية</small></h1></div>

<script>

const LV={1:'داعم',2:'متوسط',3:'متقدم'};
const LVD={1:'استقصاء موجَّه بخطوات وتلميحات ظاهرة',2:'استقصاء موجَّه بتلميحات عند الطلب',3:'استقصاء حر: أنت تصمّم التجربة'};
const STY={visual:'🎨 بصري',exp:'🔬 تجريبي',verbal:'🗣️ لفظي',math:'🔢 منطقي-رياضي'};
const ROLES=['القائد','المسجّل','مشغّل المحاكاة','المتحدّث'];
const AIR=800,D2R=Math.PI/180;
const PT={RY:{x:0,y:0,n:'الرياض'},AD:{x:780,y:-29,n:'أبوظبي'},DO:{x:485,y:64,n:'الدوحة'}};
const hAD=Math.atan2(PT.AD.y,PT.AD.x)/D2R;
const LAND=[[-100,-300],[900,-300],[900,80],[868,52],[800,5],[775,-12],[700,-22],[600,-22],[520,-22],[492,-25],[492,40],[487,64],[470,120],[453,162],[440,130],[425,60],[412,-5],[395,60],[370,140],[340,189],[302,243],[300,300],[-100,300]];
const DIRS=['الشرق','الشمال الشرقي','الشمال','الشمال الغربي','الغرب','الجنوب الغربي','الجنوب','الجنوب الشرقي'];
const dirWord=a=>DIRS[Math.round((((a%360)+360)%360)/45)%8];
const pad=n=>String(n).padStart(2,'0');
const clock=m=>{const t=8*60+Math.round(m);return pad(Math.floor(t/60)%24)+':'+pad(t%60)};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const copyText=t=>{try{navigator.clipboard.writeText(t);}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}alert('تم النسخ ✔');};

/* ================= الحالة ================= */
let roster=store.get('ps5_roster',{});
NAMES.forEach(n=>{if(!roster[n])roster[n]={level:0,style:'',group:'',role:''}});
let student='',S=null,teacherOK=false;
const defS=()=>({phase:0,done:{},level:0,kwl:{k:'',w:'',l:''},objSel:[],pre:{},ans:{},ok:{},trials:[],insq:{},types:{},c:{},quiz:{},conf:{},strat:{},reflect:{},final:null});
const save=()=>{if(student)store.set('ps5_s_'+student,S)};
const L=()=>S.level||2;
const getp=(o,p)=>p.split('.').reduce((a,k)=>a&&a[k],o);
const setp=(o,p,v)=>{const ks=p.split('.');let a=o;ks.slice(0,-1).forEach(k=>{a=a[k]=a[k]||{}});a[ks.pop()]=v};
function bind(root){$$('[data-bind]',root).forEach(el=>{const p=el.dataset.bind,v=getp(S,p);if(el.type==='checkbox')el.checked=!!v;else if(v!=null&&v!=='')el.value=v;const f=()=>{setp(S,p,el.type==='checkbox'?el.checked:el.value);save()};el.addEventListener('input',f);el.addEventListener('change',f)})}

/* ================= عناصر مساعدة ================= */
const hero=(t,p)=>`<div class="hero"><h2>${t}</h2><p>${p}</p></div>`;
const card=(t,b,c)=>`<section class="card ${c||''}">${t?`<h3>${t}</h3>`:''}${b}</section>`;
const ta=(p,ph,rows)=>`<textarea data-bind="${p}" placeholder="${ph||''}" ${rows?`style="min-height:${rows*28}px"`:''}></textarea>`;

/* ---- وسائط: فيديو مدمج + محاكاة داخل المنصة ---- */
const VID={
 kwl:{id:'DHVLO8oqZtE',t:'المسافة، الإزاحة، والسرعة'},
 hook:{id:'vLksrlyK0j4',t:'الفرق بين المسافة والإزاحة'},
 exp:{id:'f5vWlnpw9nc',t:'اتجاه وسرعة طائرة في الرياح باستخدام المتجهات (بالإنجليزية)'},
 exl:{id:'BGQ8T-W4M4U',t:'شرح المسافة والإزاحة والسرعة القياسية والاتجاهية'},
 enr:{id:'s0vBAvaEBcs',t:'استخدام المتجهات لنمذجة أثر الرياح على الطائرة (بالإنجليزية)'},
 ev:{id:'633MKb-NAtg',t:'مسألة متجهات: الطائرة والرياح (بالإنجليزية)'},
 meta:{id:'GD-LXX_iC8w',t:'مراجعة: الإزاحة والسرعة'}};
function media(key,q,sim,phet){return `<section class="card media" data-key="${key}" data-q="${q}" data-sim="${sim||''}" data-phet="${phet||''}"><div class="tabs"><button class="tab on" data-t="v">🎞️ فيديو توضيحي</button><button class="tab" data-t="s">🧪 محاكاة داخل المنصة</button>${phet?'<button class="tab" data-t="p">🌐 PhET (اختياري)</button>':''}</div><div class="mbody"></div></section>`}
function embedURL(u){let m;u=u.trim();if((m=u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/)))return{yt:'https://www.youtube.com/embed/'+m[1],page:'https://www.youtube.com/watch?v='+m[1]};if(/\.(mp4|webm)(\?.*)?$/i.test(u))return{file:u};return{link:u}}
function simInto(el,type){el.innerHTML='';if(type==='walk')initWalk(el);else if(type==='dd')initDD(el);else if(type==='vec')initVec(el);else createSim(el,{showW:true,showDir:true,showStop:false,maxW:300})}
function initWalk(host){
 host.innerHTML=`<canvas class="fluid" width="700" height="230"></canvas><div class="sim-out wk" style="margin-top:8px"></div><div class="row"><button class="btn ghost wr">↺ إعادة</button></div><p class="mut" style="font-size:13px">اسحب الرجل يميناً ويساراً على خط الأعداد (الاتجاه نحو اليمين موجب)، ثم قارن المسافة المقطوعة بالإزاحة.</p>`;
 const cv=$('canvas',host),cx=cv.getContext('2d'),out=$('.wk',host);let x=0,dist=0,drag=false;const X=m=>350+m*30,M=px=>(px-350)/30;
 const draw=()=>{cx.clearRect(0,0,700,230);cx.fillStyle='#f1f8ff';cx.fillRect(0,0,700,230);cx.strokeStyle='#12356b';cx.lineWidth=3;cx.beginPath();cx.moveTo(X(-11),170);cx.lineTo(X(11),170);cx.stroke();cx.font='13px Tajawal,sans-serif';cx.textAlign='center';cx.fillStyle='#333';cx.lineWidth=1.5;
  for(let i=-11;i<=11;i++){cx.beginPath();cx.moveTo(X(i),164);cx.lineTo(X(i),176);cx.stroke();if(i%2===0)cx.fillText(i,X(i),195)}
  cx.fillStyle='#1e9e5a';cx.beginPath();cx.arc(X(0),170,6,0,7);cx.fill();cx.fillText('البداية',X(0),215);
  if(Math.abs(x)>.01){cx.strokeStyle='#d64545';cx.lineWidth=4;cx.beginPath();cx.moveTo(X(0),158);cx.lineTo(X(x),158);cx.stroke()}
  const mx=X(x);cx.strokeStyle='#f08a24';cx.fillStyle='#f08a24';cx.lineWidth=4;cx.beginPath();cx.arc(mx,92,13,0,7);cx.fill();cx.beginPath();cx.moveTo(mx,105);cx.lineTo(mx,140);cx.moveTo(mx,115);cx.lineTo(mx-16,132);cx.moveTo(mx,115);cx.lineTo(mx+16,132);cx.moveTo(mx,140);cx.lineTo(mx-12,168);cx.moveTo(mx,140);cx.lineTo(mx+12,168);cx.stroke();
  const d=Math.round(x*10)/10;out.innerHTML=`📍 الموضع: <b>${d} m</b><br>🛣️ المسافة المقطوعة (مجموع ما سار): <b>${dist.toFixed(1)} m</b><br>➡️ الإزاحة (الموضع النهائي − الابتدائي): <b>${d} m</b> ${d>0?'نحو اليمين (+)':d<0?'نحو اليسار (−)':'(صفر: عاد إلى البداية)'}<br>📌 جرّب: امشِ 5 m يميناً ثم 5 m يساراً، ولاحظ أن الإزاحة تصبح صفراً والمسافة 10 m.`};
 const pos=e=>{const r=cv.getBoundingClientRect();return(e.clientX-r.left)*700/r.width};
 cv.addEventListener('pointerdown',e=>{if(Math.abs(pos(e)-X(x))<45){drag=true;cv.setPointerCapture(e.pointerId)}});
 cv.addEventListener('pointermove',e=>{if(!drag)return;const nx=Math.max(-11,Math.min(11,Math.round(M(pos(e))*10)/10));dist+=Math.abs(nx-x);x=nx;draw()});
 cv.addEventListener('pointerup',()=>drag=false);$('.wr',host).onclick=()=>{x=0;dist=0;draw()};draw()}
function initMedia(root){$$('.media',root).forEach(box=>{
 const key=box.dataset.key,q=box.dataset.q,ph=box.dataset.phet,simT=box.dataset.sim,body=$('.mbody',box);
 function showV(){const cust=store.get('ps5_vid',{})[key],e=cust?embedURL(cust):{yt:'https://www.youtube.com/embed/'+VID[key].id,page:'https://www.youtube.com/watch?v='+VID[key].id};
  let h='';
  if(e.yt)h=`<div class="vwrap"><iframe src="${e.yt}" title="فيديو توضيحي" allow="accelerometer; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>`;
  else if(e.file)h=`<video controls src="${e.file}" style="width:100%;border-radius:12px"></video>`;
  else h=`<p><a target="_blank" rel="noopener" href="${e.link}">فتح الفيديو في نافذة جديدة</a></p>`;
  h+=`<p style="margin:8px 0 2px"><b>🎬 ${cust?'فيديو مخصّص من المعلم':VID[key].t}</b></p><div class="row">${e.page?`<a class="btn ghost" target="_blank" rel="noopener" href="${e.page}">↗ فتح في يوتيوب (إن لم يظهر هنا)</a>`:''}<a class="btn ghost" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(q)}">🔎 فيديوهات أخرى</a></div>
  <details><summary>استبدال الفيديو برابط آخر</summary><div class="row"><input type="text" class="in vurl" placeholder="رابط يوتيوب أو mp4" style="flex:1;min-width:200px"><button class="btn sec" data-add>دمج</button>${cust?'<button class="btn ghost" data-rm>استعادة الافتراضي</button>':''}</div></details>`;
  body.innerHTML=h;const add=$('[data-add]',body),rm=$('[data-rm]',body);
  if(add)add.onclick=()=>{const v=$('.vurl',body).value.trim();if(!v)return;const o=store.get('ps5_vid',{});o[key]=v;store.set('ps5_vid',o);showV()};
  if(rm)rm.onclick=()=>{const o=store.get('ps5_vid',{});delete o[key];store.set('ps5_vid',o);showV()}}
 function showS(){body.innerHTML='<div class="msim"></div>';simInto($('.msim',body),simT)}
 function showP(){const u=`https://phet.colorado.edu/sims/html/${ph}/latest/${ph}_all.html?locale=ar`;body.innerHTML=`<div class="phet"><div class="vwrap"><iframe src="${u}" allowfullscreen loading="lazy"></iframe></div></div><div class="row"><a class="btn ghost" target="_blank" rel="noopener" href="${u}">فتح المحاكاة في نافذة مستقلة ↗</a><span class="mut">(محاكاة PhET خارجية تحتاج إنترنت؛ إن لم تظهر فاستخدم المحاكاة الداخلية)</span></div>`}
 $$('.tab',box).forEach(b=>b.onclick=()=>{$$('.tab',box).forEach(x=>x.classList.remove('on'));b.classList.add('on');b.dataset.t==='v'?showV():b.dataset.t==='s'?showS():showP()});
 showV()})}

function initDD(host){

 const cv=$('canvas',host),cx=cv.getContext('2d'),out=$('.dd',host),A={x:70,y:170},B={x:630,y:170},K=780/560;let W={x:350,y:60},drag=false;
 const draw=()=>{const back=$('.back',host).checked,E=back?A:B;cx.clearRect(0,0,700,300);cx.fillStyle='#eaf4fb';cx.fillRect(0,0,700,300);cx.direction='rtl';cx.textAlign='center';cx.font='700 14px Tajawal,sans-serif';
  cx.strokeStyle='#1d5aa8';cx.lineWidth=4;cx.beginPath();cx.moveTo(A.x,A.y);cx.lineTo(W.x,W.y);cx.lineTo(E.x,E.y);cx.stroke();

function taskCard(t){const l=L(),v=S.ans[t.id];
 const inp=t.type==='num'?`<input type="number" step="any" class="in" data-task="${t.id}" value="${v??''}"> ${t.unit||''}`:`<select class="in" data-task="${t.id}"><option value="">اختر…</option>${t.opts.map((o,i)=>`<option value="${i}" ${String(v)===String(i)?'selected':''}>${o}</option>`).join('')}</select>`;
 const hint=l===1?`<div class="hint on">💡 ${t.h1}</div>`:l===2?`<button class="btn ghost" data-h="${t.id}" style="padding:2px 10px;font-size:13px">💡 تلميح</button><div class="hint" id="h_${t.id}">${t.h2}</div>`:'';
 const st=S.ok[t.id];
 return `<div class="task ${st?'okc':''}" id="tk_${t.id}"><div><b>${t.q}</b></div>${hint}<div class="row">${inp}<button class="btn" data-check="${t.id}">تحقق</button></div><div class="fb ${st===true?'ok':st===false?'bad':''}" id="fb_${t.id}">${st===true?'✅ '+t.ex:st===false?'❌ حاول مرة أخرى.':''}</div></div>`}
function wireTasks(root){
 $$('[data-task]',root).forEach(el=>{const f=()=>{S.ans[el.dataset.task]=el.value;save()};el.addEventListener('input',f);el.addEventListener('change',f)});
 $$('[data-h]',root).forEach(b=>b.onclick=()=>$('#h_'+b.dataset.h).classList.toggle('on'));
 $$('[data-check]',root).forEach(b=>b.onclick=()=>{const t=TASKS.find(x=>x.id===b.dataset.check),v=S.ans[t.id],fb=$('#fb_'+t.id);
  if(v===undefined||v===''){fb.className='fb warn';fb.textContent='أدخل إجابتك أولاً.';return}
  let ok;if(t.type==='num'){const [lo,hi]=t.range?t.range():[t.min,t.max];ok=+v>=lo&&+v<=hi}else ok=+v===t.correct;
  S.ok[t.id]=ok;save();$('#tk_'+t.id).classList.toggle('okc',ok);fb.className='fb '+(ok?'ok':'bad');fb.innerHTML=ok?'✅ '+t.ex:'❌ غير دقيقة. '+(L()===3?'راجع طريقة تجربتك وقياساتك.':'جرّب مرة أخرى مستعيناً بالتلميح.')})}

function makeGroups(mode,size){const lv=n=>roster[n].level||2;let names=NAMES.slice(),gr=[];
 NAMES.forEach(n=>{roster[n].group='';roster[n].role=''});
 const chunk=()=>{for(let i=0;i<names.length;i+=size)gr.push(names.slice(i,i+size));if(gr.length>1&&gr[gr.length-1].length<3){const l=gr.pop();gr[gr.length-1]=gr[gr.length-1].concat(l)}};
 if(mode==='homo'){names.sort((a,b)=>lv(a)-lv(b));chunk()}
 else if(mode==='hetero'){const n=Math.ceil(names.length/size);names.sort((a,b)=>lv(b)-lv(a));gr=Array.from({length:n},()=>[]);names.forEach((nm,i)=>{const r=Math.floor(i/n),k=i%n;gr[r%2===0?k:n-1-k].push(nm)})}
 else if(mode==='style'){const o=['visual','exp','verbal','math',''];names.sort((a,b)=>o.indexOf(roster[a].style)-o.indexOf(roster[b].style)||lv(a)-lv(b));chunk()}
 else{store.set('ps5_roster',roster);return}
 gr.forEach((g,gi)=>g.forEach((nm,ri)=>{roster[nm].group='المجموعة '+(gi+1);roster[nm].role=ROLES[ri%ROLES.length]}));store.set('ps5_roster',roster)}

 const mk=$('#gmk',m);if(mk)mk.onclick=()=>{const picks=$$('[data-gm]',m).filter(c=>c.checked).map(c=>+c.dataset.gm);
  if(!picks.length){alert('اختر زميلاً واحداً على الأقل');return}if(picks.length+1>MAXG){alert('الحد الأقصى '+MAXG+' أعضاء');return}
  let name=$('#gname').value.trim()||'مجموعة '+(Object.keys(gm).length+1);while(gm[name])name+='*';
  me.group=name;me.role=$('#rme').value;picks.forEach(i=>{const n=free[i];roster[n].group=name;roster[n].role=$(`[data-gr="${i}"]`,m).value});sv();openGroups()};
 $$('[data-join]',m).forEach(b=>b.onclick=()=>{me.group=b.dataset.join;me.role=$(`[data-jr="${b.dataset.join}"]`,m).value;sv();openGroups()});
 m.onclick=e=>{if(e.target===m)closeG()}}

(function init(){
 const sel=$('#lsel');sel.innerHTML='<option value="">— اختر اسمك —</option>'+NAMES.map(n=>`<option>${n}</option>`).join('');
 $('#lgo').onclick=()=>{const nm=$('#lname').value.trim()||sel.value;if(!nm){alert('اختر اسمك أو اكتبه');return}
  grp=null;student=nm;S=Object.assign(defS(),store.get('ps5_s_'+nm,{}));const rl=roster[nm]&&roster[nm].level;if(rl)S.level=rl;
  $('#login').classList.add('hidden');updChip();renderSteps();go(S.phase||0)};
 $('#lgroup').onclick=openGroupLogin;
 $('#lteacher').onclick=()=>{$('#login').classList.add('hidden');if(!S){S=defS()}openTeacher();$('#tmodal').addEventListener('click',e=>{if(e.target.id==='tmodal'){$('#tmodal').classList.add('hidden');if(!student)$('#login').classList.remove('hidden')}})}
})();
